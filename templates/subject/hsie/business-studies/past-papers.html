{% extends 'layout.html' %} {% block content %}
<div class="container mt-5">
  <div class="row mb-3">
    <div class="col-12">
      <h1>Business Studies - Past Papers</h1>
    </div>
  </div>

  <div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-4">
    <!-- card here -->
    <div class="col">
      <div class="card h-100">
        <img
          src="{{ url_for('static', filename='images/resource-card-images/nesa-logo.png') }}"
          class="card-img-top"
          alt="NESA logo"
          style="
            height: 180px;
            object-fit: contain;
            background-color: #f8f9fa;
            padding: 1rem;
          "
        />
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">2025 HSC Exam Paper</h5>
          <p class="card-text text-muted">NESA - Business Studies</p>
          <a
            href="{{ url_for('static', filename='pdfs/business-studies/hsc-papers/2025-hsc-business-studies.pdf') }}"
            target="_blank"
            class="btn btn-primary mt-auto"
            >View PDF <i class="bi bi-arrow-up-right"></i
          ></a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
