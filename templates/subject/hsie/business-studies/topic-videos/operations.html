{% extends 'layout.html' %} {% block content %}
<div class="container mt-5">
  <div class="row mb-3">
    <div class="col-12">
      <h1>Business Studies - Operations Videos</h1>
    </div>
  </div>

  <div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-4">
    <!-- card here -->
    <div class="col-12 col-sm-6 col-md-3">
      <div class="card h-100">
        <div class="ratio ratio-16x9">
          <iframe
            class="w-100 h-100 border-0"
            src="https://www.youtube.com/embed/2jXyRuYNg80?start=186"
            title="Role of Operations"
            allow="
              accelerometer;
              autoplay;
              clipboard-write;
              encrypted-media;
              gyroscope;
              picture-in-picture;
              web-share;
            "
            allowfullscreen
            loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin"
          ></iframe>
        </div>

        <div class="card-body d-flex flex-column">
          <h5 class="card-title">Role of Operations</h5>
          <p class="card-text text-muted">
            An overview of the role operations plays in business.
          </p>
          <a
            href="https://www.youtube.com/watch?v=2jXyRuYNg80&t=186s"
            target="_blank"
            rel="noopener noreferrer"
            class="btn btn-primary mt-auto"
            >Watch Video <i class="bi bi-arrow-up-right"></i
          ></a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
